# Final boss (dragon) decision-layer training config (PPO)
# NOTE: keep this file ASCII-only. mlagents-learn reads it with the Windows default codepage,
#       so Korean comments make it fail to decode.
# Scene : Assets/01_Scenes/Training/DragonTrainingScene.unity (16 arenas in parallel)
# Run   : mlagents-learn MLAgents/dragon_ppo.yaml --run-id=dragon-ppo-01 --time-scale=20
behaviors:
  DragonBoss:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 5120
      learning_rate: 3.0e-4
      beta: 5.0e-3 
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 400000
    time_horizon: 64
    summary_freq: 5000
    checkpoint_interval: 50000
    keep_checkpoints: 5
