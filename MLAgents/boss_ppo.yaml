# 보스 강화학습 설정 (PPO). 기준 글: sleepyfinger.com/article/ml-agents-boss-monster-ai
# 값은 글의 예시를 그대로 가져온 시작점이다. 학습 곡선을 보고 조정할 것.
behaviors:
  BossAgent:            # BehaviorParameters의 Behavior Name과 같아야 한다
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 100000
    keep_checkpoints: 5
